kind = "web"
previewPath = "/"
title = "Rently"
description = "A branded public Rently homepage and interactive demo portfolio for independent landlords and small property owners. Visitors can browse sample properties, inspect linked tenant and lease details, and download a clearly labeled sample lease PDF. Real Supabase data and contract storage are not connected yet."
version = "1.0.0"
id = "artifacts/rently"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20829

[services.development]
run = "pnpm --filter @workspace/rently run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rently", "run", "build" ]
serve = "static"
publicDir = "artifacts/rently/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20829"
BASE_PATH = "/"

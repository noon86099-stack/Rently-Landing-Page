kind = "web"
previewPath = "/"
title = "Rently"
description = "Private rental-property workspace with Supabase email/password authentication, owner-scoped properties and tenant details, lease creation, monthly rent schedules, payment records, private signed lease files, and generated PDF drafts. Rent management requires the accompanying Supabase migration."
version = "1.0.0"
id = "artifacts/rently"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20829

[services.development]
run = "pnpm --filter @workspace/rently run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rently", "run", "build" ]
serve = "static"
publicDir = "artifacts/rently/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20829"
BASE_PATH = "/"
